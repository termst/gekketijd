<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gekke Tijd</title>
<link rel="preload" href="fonts/escargoth.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/webp" href="img/logo-sm.webp">
<link rel="preload" href="img/logo.webp" as="image">
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<section id="lobby">
  <div class="card">
    <h1 class="logo"><img src="img/logo.webp" alt="Gekke Tijd" width="1008" height="598"></h1>
    <div class="life" aria-label="Lifetime stats">
      <div class="won"><small>Won</small><b><span class="orra-inline"></span><span id="lwon">0</span></b></div>
      <div class="lost"><small>Lost</small><b><span class="orra-inline"></span><span id="llost">0</span></b></div>
      <div class="wal"><small>Wallet</small><b><span class="orra-inline"></span><span id="lwal">500</span></b></div>
    </div>
    <div id="home" class="view">
      <label>Your name<input id="nm" maxlength="16" autocomplete="nickname" placeholder="Name"></label>
      <div id="joinbox" class="grp">
        <h3>Join a lobby</h3>
        <div class="line"><input id="jc" maxlength="4" placeholder="CODE" class="code" autocomplete="off" aria-label="Lobby code"><button class="btn go" id="jb">Join</button></div>
      </div>
      <div class="grp">
        <h3>Create a lobby</h3>
        <div class="line"><input id="cv" maxlength="4" placeholder="RANDOM" class="code" autocomplete="off" aria-label="Own lobby code, leave empty for a random code"><button class="btn go" id="cb">Create</button></div>
        <p class="hint">4 letters or digits, or empty for a random code.</p>
      </div>
    </div>
    <div id="setup" class="view" hidden>
      <div class="shead"><h3>Run settings</h3><span class="scode" id="scode"></span></div>
      <div id="opts" class="opts"></div>
      <div class="sacts"><button class="btn" id="sback">Back</button><button class="btn" id="sreset">Defaults</button><button class="btn go" id="sgo">Open lobby</button></div>
    </div>
    <p id="lerr" role="alert"></p>
  </div>
</section>

<section id="game" hidden>
<header><h1 class="logo"><img src="img/logo-sm.webp" alt="Gekke Tijd" width="504" height="299"></h1>
  <div class="tools">
    <span class="roomchip" title="Lobby code"><small>Lobby</small><b id="room"></b><button class="btn sm" id="invite">Copy invite</button></span>
    <span class="sep"></span>
    <span id="lvl" class="lvlchip"></span>
    <span class="sep"></span>
    <button class="btn" id="shop">Cashier</button><button class="btn" id="help">Rules</button><button class="btn ghost" id="snd" aria-pressed="true">Sound on</button>
  </div>
</header>
<div id="people" aria-label="Players"></div>
<main>
  <div id="stage"><canvas id="wheel" width="1650" height="1650" role="img" aria-label="Wheel with 48 fields"></canvas></div>
  <div id="say" role="status" aria-live="polite"></div>
  <div id="clock"><i></i></div>
  <div id="hist" aria-label="Recent results"></div>
  <div id="table"><div id="street"></div><div id="quay"></div></div>
</main>
</section>

<div id="bonus" role="dialog" aria-modal="true"><div id="box"></div></div>
<div id="toast" role="status"></div>

<dialog id="rules" aria-labelledby="rules-h"><div class="dhead"><h2 id="rules-h">How to play</h2><form method="dialog"><button class="btn sm">Close</button></form></div><div class="dbody" id="rulebody"></div></dialog>
<dialog id="work" aria-labelledby="work-h"><div class="dhead"><h2 id="work-h">Cashier</h2><form method="dialog"><button class="btn sm">Close</button></form></div><div class="dbody" id="workbody"></div></dialog>

<script src="server-mode.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="shared.js"></script>
<script src="core.js"></script>
<script src="games-bundle.js"></script>
<script src="net.js"></script>
<script src="client.js"></script>
<script src="games/spare-change.js"></script>
<script src="games/cash-grab.js"></script>
<script src="games/drop-dead.js"></script>
<script src="games/productivitime.js"></script>
<script>RH.boot()</script>
</body>
</html>
