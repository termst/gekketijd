<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rare Hours</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<section id="lobby">
  <div class="card">
    <h1 class="logo">Rare Hours</h1>
    <p class="sub">Multiplayer wheel of fortune. Play money only: <span class="orra-inline"></span> Orra has no real value.</p>
    <label>Your name<input id="nm" maxlength="16" autocomplete="nickname" placeholder="Name"></label>
    <div id="joinbox" class="grp">
      <h3>Join a lobby</h3>
      <div class="line"><input id="jc" maxlength="4" placeholder="CODE" class="code" autocomplete="off"><button class="btn go" id="jb">Join</button></div>
    </div>
    <div class="grp">
      <h3>Create a lobby</h3>
      <label class="chk"><input type="checkbox" id="cc"> Choose my own 4 character code</label>
      <div class="line"><input id="cv" maxlength="4" placeholder="ABCD" class="code" autocomplete="off" disabled><button class="btn go" id="cb">Create</button></div>
    </div>
    <p id="lerr" role="alert"></p>
  </div>
</section>

<section id="game" hidden>
<header><h1 class="logo">Rare Hours</h1>
  <div class="tools">
    <span id="room" class="roomchip" title="Lobby code"></span>
    <button class="btn" id="invite">Copy invite link</button>
    <span id="lvl"></span>
    <button class="btn" id="shop">Cashier</button><button class="btn" id="help">Rules</button><button class="btn" id="snd">Sound on</button>
  </div>
</header>
<div id="people" aria-label="Players"></div>
<main>
  <div id="stage"><canvas id="wheel" width="1100" height="1140" role="img" aria-label="Wheel with 48 fields"></canvas></div>
  <div id="say" role="status" aria-live="polite"></div>
  <div id="clock"><i></i></div>
  <div id="hist" aria-label="Recent results"></div>
  <div id="table"><div id="street"></div><div id="quay"></div></div>
</main>
</section>

<div id="bonus" role="dialog" aria-modal="true"><div id="box"></div></div>
<div id="toast" role="status"></div>

<dialog id="rules"><h2>How to play</h2><div id="rulebody"></div><form method="dialog"><button class="btn">Close</button></form></dialog>
<dialog id="work"><h2>Cashier</h2><div id="workbody"></div><form method="dialog"><button class="btn">Close</button></form></dialog>

<script src="server-mode.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="shared.js"></script>
<script src="core.js"></script>
<script src="games-bundle.js"></script>
<script src="net.js"></script>
<script src="client.js"></script>
<script src="games/spare-change.js"></script>
<script src="games/cash-grab.js"></script>
<script src="games/drop-dead.js"></script>
<script src="games/productivitime.js"></script>
<script>RH.boot()</script>
</body>
</html>
